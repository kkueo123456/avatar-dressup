stages:
  - build
  - deploy

build:
  stage: build
  script:
    # 在 Gitee CI 环境里安装 Node.js 20（避免权限问题，装到用户目录）
    - export N_PREFIX=$HOME/.n
    - export PATH=$N_PREFIX/bin:$PATH
    - npm install -g n --registry=https://registry.npmmirror.com
    - n --mirror https://npmmirror.com/mirrors/node 20
    - hash -r || true
    - node -v
    - npm -v
    # 安装依赖并构建
    - npm ci --registry=https://registry.npmmirror.com
    - npx prisma generate
    - npm run build
  artifacts:
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
      - next.config.ts
      - tsconfig.json
      - prisma/

deploy:
  stage: deploy
  dependencies:
    - build
  script:
    - apt-get update && apt-get install -y openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H 49.233.148.141 >> ~/.ssh/known_hosts
    # 同步构建产物到服务器
    - rsync -avz --delete --exclude=.env .next/ public/ package.json package-lock.json next.config.ts tsconfig.json prisma/ ubuntu@49.233.148.141:~/avatar-dressup/
    # 服务器上安装依赖并重启
    - ssh ubuntu@49.233.148.141 "cd ~/avatar-dressup && npm ci --registry=https://registry.npmmirror.com && pm2 delete avatar-dressup 2>/dev/null; pm2 start 'npx next start -p 3000 -H 0.0.0.0' --name avatar-dressup && pm2 save"
