displayName: 自动部署流水线
stages:
  - stage: build
    name: 构建
    steps:
      - step: npm_build@default
        name: 安装依赖并构建
        inputs:
          node_version: "20"
          run: |
            npm install -g n --registry=https://registry.npmmirror.com
            n --mirror https://npmmirror.com/mirrors/node 20
            hash -r || true
            node -v
            npm ci --registry=https://registry.npmmirror.com
            npx prisma generate
            npm run build
      - step: artifact_upload@default
        name: 上传构建产物
        inputs:
          artifact_name: dist
          path: |
            .next/
            public/
            package.json
            package-lock.json
            next.config.ts
            tsconfig.json
            prisma/

  - stage: deploy
    name: 部署
    steps:
      - step: artifact_download@default
        name: 下载构建产物
        inputs:
          artifact_name: dist
          path: ~/avatar-dressup/
      - step: ssh_deploy@default
        name: 部署到服务器
        inputs:
          ssh_private_key: ${{ secrets.DEPLOY_KEY }}
          host: 49.233.148.141
          port: 22
          user: ubuntu
          deploy_dir: /home/ubuntu/avatar-dressup
          deploy_script: |
            cd ~/avatar-dressup
            npm ci --registry=https://registry.npmmirror.com
            pm2 delete avatar-dressup 2>/dev/null || true
            pm2 start "npx next start -p 3000 -H 0.0.0.0" --name avatar-dressup
            pm2 save
