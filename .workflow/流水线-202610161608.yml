version: "1.0"
name: 构建、部署到自有主机
displayName: 构建、部署到自有主机
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: ""
    displayName: Nodejs 构建
    nodeVersion: 20.10.0
    commands:
    - "# 设置NPM源，提升安装速度"
    - npm config set registry https://registry.npmmirror.com
    - "# 替换lock文件里的旧镜像地址，防止下载超时"
    - sed -i 's|https://nexus.noddincoffee.com/repository/npm-public|https://registry.npmmirror.com|g' package-lock.json
    - sed -i 's|https://registry.npmjs.org|https://registry.npmmirror.com|g' package-lock.json
    - npm ci --registry=https://registry.npmmirror.com
    - npx prisma generate
    - npm run build
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - .next/
      - public/
      - prisma/
      - src/worker/
      - ecosystem.config.cjs
      - package.json
      - package-lock.json
      - next.config.ts
      - tsconfig.json
      type: .tar.gz
    caches:
    - "~/.npm"
    - "~/.yarn"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 部署
  displayName: 部署
  strategy: naturally
  trigger: auto
  steps:
  - step: deploy@agent
    name: ""
    displayName: 主机部署
    deployArtifact:
    - name: output
      target: "~/avatar-dressup"
      source: build
      dependArtifact: BUILD_ARTIFACT
      artifactRepository: default
      artifactName: output
      artifactVersion: latest
    script: |
      cd ~/avatar-dressup
      # 备份 .env 和 public（产物里可能不包含它们）
      cp .env /tmp/avatar-env.backup 2>/dev/null || true
      cp -r public /tmp/avatar-public.backup 2>/dev/null || true
      # 清理旧构建产物（保留 node_modules 和源码）
      rm -rf .next public prisma next.config.ts tsconfig.json package.json package-lock.json
      # 解压构建产物
      tar -xzf output.tar.gz 2>/dev/null || true
      # 恢复 .env
      cp /tmp/avatar-env.backup .env 2>/dev/null || true
      # 恢复 public（如果产物里没有，从备份或 git 恢复）
      if [ ! -d "public" ]; then
        cp -r /tmp/avatar-public.backup public 2>/dev/null || git checkout -- public/
      fi
      # 安装依赖
      npm install --legacy-peer-deps
      # 生成 Prisma 客户端
      npx prisma generate
      # 同步表结构到数据库（项目无 migrations 目录，用 db push；新增列均可空/有默认值，不会丢数据）
      npx prisma db push --skip-generate
      # 同步服务器源码到最新提交（保证兜底构建用的是新代码；.env/node_modules 未被跟踪不受影响）
      git fetch https://gitee.com/pu_zi_jie/avatar-dressup.git main 2>/dev/null && git reset --hard FETCH_HEAD 2>/dev/null || true
      # 兜底：如果 .next/ 不存在（产物传输失败），在服务器上构建
      if [ ! -d ".next" ] || [ ! -f ".next/BUILD_ID" ]; then
        echo "缺少 .next/，在服务器上构建..."
        NODE_OPTIONS='--max-old-space-size=1536' npx next build
      fi
      # 启动（关键：PM2 配置文件会自行加载 .env 注入进程环境，
      # 双进程：avatar-dressup = next start，poster-worker = 海报异步任务消费者）
      pm2 delete avatar-dressup 2>/dev/null || true
      pm2 delete poster-worker 2>/dev/null || true
      pm2 start ecosystem.config.cjs
      pm2 save
    hostGroupID:
      ID: prod
      hostID:
      - 785a5426-738e-4e60-8a5e-f908b8265619
    notify: []
    strategy:
      retry: "0"
triggers:
  push:
    branches:
      include:
        - main
notify: []
strategy:
  blocking: true
variables:
  DEPLOY_KEY:
    type: TEXT
    default: |
      # 安全说明：原配置曾将部署服务器 SSH 私钥（DEPLOY_KEY）明文硬编码于此并提交 git，
# 属于安全事故——私钥已入库即视为泄露。必须：
# 1) 删除服务器 authorized_keys 中对应公钥并重新生成密钥对
# 2) 在 Gitee「仓库设置 → 流水线 → 密钥管理」中配置 DEPLOY_KEY
# 3) 若仓库曾公开，用 git filter-repo 清理历史提交
TO_BE_CONFIGURED_IN_GITEE_PIPELINE_SECRETS
