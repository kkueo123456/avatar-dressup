version: "1.0"
name: 构建、部署到自有主机
displayName: 构建、部署到自有主机
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: ""
    displayName: Nodejs 构建
    nodeVersion: 20.10.0
    commands:
    - "# 设置NPM源，提升安装速度"
    - npm config set registry https://registry.npmmirror.com
    - "# 替换lock文件里的旧镜像地址，防止下载超时"
    - sed -i 's|https://nexus.noddincoffee.com/repository/npm-public|https://registry.npmmirror.com|g' package-lock.json
    - sed -i 's|https://registry.npmjs.org|https://registry.npmmirror.com|g' package-lock.json
    - npm ci --registry=https://registry.npmmirror.com
    - npx prisma generate
    - npm run build
    - "# standalone模式：把 public 和 static 复制到 standalone 目录"
    - cp -r public .next/standalone/ 2>/dev/null || true
    - cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - .next/standalone/
      type: .tar.gz
    caches:
    - "~/.npm"
    - "~/.yarn"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 部署
  displayName: 部署
  strategy: naturally
  trigger: auto
  steps:
  - step: deploy@agent
    name: ""
    displayName: 主机部署
    deployArtifact:
    - name: output
      target: "~/avatar-dressup"
      source: build
      dependArtifact: BUILD_ARTIFACT
      artifactRepository: default
      artifactName: output
      artifactVersion: latest
    script: |
      cd ~/avatar-dressup
      rm -rf .next 2>/dev/null || true
      cp -r output/* . 2>/dev/null || true
      pm2 delete avatar-dressup 2>/dev/null || true
      pm2 start ".next/standalone/server.js" --name avatar-dressup
      pm2 save
    hostGroupID:
      ID: prod
      hostID:
      - 785a5426-738e-4e60-8a5e-f908b8265619
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
